name: Diagnose external Encyclopedia preview

on:
  push:
    branches:
      - encyclopedia-update-2026
    paths:
      - .github/workflows/verify-external-preview.yml

permissions:
  contents: read

jobs:
  check-preview:
    if: github.ref == 'refs/heads/encyclopedia-update-2026'
    runs-on: ubuntu-latest
    steps:
      - name: Compare branch and immutable preview assets
        shell: bash
        run: |
          set -euo pipefail
          REPO="socman2023/podnebesie-wiki"
          BRANCH="encyclopedia-update-2026"
          COMMIT="c4a8734999af95298aca81cf2f2dc03471994d1d"
          for REF in "$BRANCH" "$COMMIT"; do
            echo "====== REF $REF ======"
            BASE="https://raw.githack.com/$REPO/$REF"
            for FILE in "index.html" "data.js" "app.js" "images/locations/academia/01.webp" "images/locations/academia/thumbs/01.webp"; do
              echo "-- $FILE --"
              STATUS=$(curl --location --silent --show-error --max-time 25 -o /tmp/preview-response -w "%{http_code}" "$BASE/$FILE")
              echo "status=$STATUS bytes=$(wc -c </tmp/preview-response) type=$(file -b /tmp/preview-response)"
              if [[ "$FILE" == "data.js" ]]; then
                grep -o 'Друг · Боруск · [0-9]* лет' /tmp/preview-response | head -1 || true
                grep -o 'Главный герой · Росс · [0-9]* лет' /tmp/preview-response | head -1 || true
                grep -o 'images/locations/academia/01\.[a-z]*' /tmp/preview-response | head -1 || true
              fi
              if [[ "$FILE" == *.webp ]]; then
                head -c 16 /tmp/preview-response | od -An -tx1
              fi
            done
          done
