name: Check updated Encyclopedia interface

on:
  push:
    branches:
      - encyclopedia-update-2026
    paths:
      - .github/workflows/smoke-encyclopedia.yml
      - scripts/smoke_encyclopedia.mjs

permissions:
  contents: read

jobs:
  browser-check:
    if: github.ref == 'refs/heads/encyclopedia-update-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve Encyclopedia locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/encyclopedia-server.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Check desktop/mobile and both themes
        run: node scripts/smoke_encyclopedia.mjs
