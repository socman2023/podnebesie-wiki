name: Build Academia WebP images

on:
  push:
    branches:
      - encyclopedia-update-2026
    paths:
      - .github/workflows/academia-webp.yml
      - scripts/optimize_academia.py

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/encyclopedia-update-2026'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the working branch
        uses: actions/checkout@v4
        with:
          ref: encyclopedia-update-2026
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install 'Pillow==11.3.0'

      - name: Convert remaining photos in small verified batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for batch in {1..10}; do
            echo "Processing batch ${batch} of 10"
            python scripts/optimize_academia.py --limit 8
            git add images/locations/academia/
            if ! git diff --cached --quiet; then
              git commit -m "Add Academia WebP images batch ${batch}"
              git push origin HEAD:encyclopedia-update-2026
            fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("images/locations/academia/webp-report.json").read_text())
          assert data["converted_count"] == 81, data["converted_count"]
          print("All 81 Academia images converted and verified")
          PY
