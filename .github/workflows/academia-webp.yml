name: Build Academia WebP images

on:
  push:
    branches:
      - encyclopedia-update-2026
    paths:
      - .github/workflows/academia-webp.yml
      - scripts/optimize_academia.py

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/encyclopedia-update-2026'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the working branch
        uses: actions/checkout@v4
        with:
          ref: encyclopedia-update-2026
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install 'Pillow==11.3.0'

      - name: Optimize first eight photographs
        run: python scripts/optimize_academia.py --limit 8

      - name: Commit converted images to the working branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/locations/academia/
          if ! git diff --cached --quiet; then
            git commit -m "Add first Academia WebP photos and thumbnails"
            git push origin HEAD:encyclopedia-update-2026
          fi
