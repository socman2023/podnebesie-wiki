name: Check pinned Encyclopedia preview in browser

on:
  push:
    branches:
      - encyclopedia-update-2026
    paths:
      - .github/workflows/check-external-preview.yml
      - scripts/check_external_preview.mjs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check external preview ages and WebP images
        run: node scripts/check_external_preview.mjs
