name: Optimize staged location photo albums
on:
  push:
    branches:
      - encyclopedia-update-2026
    paths:
      - "images/locations/**/source/**"
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
      - name: Install image converter
        run: python3 -m pip install Pillow==11.3.0
      - name: Generate optimized WebP and thumbnails
        run: python3 scripts/optimize_location_images.py images/locations
      - name: Commit photos to working branch
        run: |
          git add -A images/locations
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Optimize Zlatograd gallery images'
            git push origin HEAD:encyclopedia-update-2026
          fi
